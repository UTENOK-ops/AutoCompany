{% extends 'base.html' %}
{% block title %}{{ query.title }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ query.title }}</h1>
  <p class="muted">{{ query.description }}</p>
  {% if error_message %}<div class="alert">{{ error_message }}</div>{% endif %}
  <form method="post" class="form">
    {% for f in query.fields %}
      <label>{{ f.label }}
        {% if f.type == 'select' %}
          <select name="{{ f.name }}" required>
            {% for value, text in f.options %}
              <option value="{{ value }}" {% if values.get(f.name) == value %}selected{% endif %}>{{ text }}</option>
            {% endfor %}
          </select>
        {% else %}
          <input type="{{ f.type }}" name="{{ f.name }}" value="{{ values.get(f.name, '') }}"
                 {% if f.min is defined %}min="{{ f.min }}"{% endif %}
                 {% if f.step is defined %}step="{{ f.step }}"{% endif %} required>
        {% endif %}
      </label>
    {% endfor %}
    <button type="submit" class="btn">Выполнить запрос</button>
  </form>
  <div class="actions"><a class="btn btn-secondary" href="{{ url_for('bp_query.query_menu') }}">← К меню запросов</a></div>
</div>
{% endblock %}
