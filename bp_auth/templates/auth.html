{% extends 'base.html' %}
{% block title %}Авторизация{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Вход в систему</h1>
  <p class="muted">Авторизация внутренних пользователей</p>
  {% if error_message %}<div class="alert">{{ error_message }}</div>{% endif %}
  <form method="post" action="{{ url_for('bp_auth.auth_index') }}" class="form">
    <label>Логин
      <input type="text" name="login" value="{{ login }}" required autofocus>
    </label>
    <label>Пароль
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn">Войти</button>
  </form>
</div>
{% endblock %}
